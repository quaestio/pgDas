services:
  pgdas:
    build: .
    restart: unless-stopped
    environment:
      PGDAS_SECRET_KEY: ${PGDAS_SECRET_KEY:?Set PGDAS_SECRET_KEY in .env}
      PGDAS_ALLOWED_HOSTS: ${PGDAS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PGDAS_CSRF_TRUSTED_ORIGINS: ${PGDAS_CSRF_TRUSTED_ORIGINS:-}
      # Plain http on localhost; set to 1 once PGDAS is served over https behind a reverse proxy.
      PGDAS_SECURE_COOKIES: ${PGDAS_SECURE_COOKIES:-0}
      PGDAS_SQLITE_PATH: /app/data/pgdas.sqlite3
    volumes:
      # PGDAS's own data (users, saved servers, audit log) is one SQLite file in this volume.
      - pgdas-data:/app/data
    ports:
      # Bound to localhost only. Put an https reverse proxy in front before exposing it.
      - "127.0.0.1:8000:8000"

volumes:
  pgdas-data:
