{% if user.is_staff and s.ssh_enabled and s.ssh_prompt_passphrase %}{% with until=s.ssh_unlocked_until %}{% if until %}<span class="badge ok" title="Unlocked until {{ until|date:'H:i' }} UTC">unlocked</span> <button type="button" class="btn" data-server-lock="{{ s.pk }}" data-url="{% url 'server_lock' s.pk %}">Lock</button>{% else %}<span class="badge warn" title="The SSH key asks for its passphrase">locked</span> <button type="button" class="btn primary" data-server-unlock="{{ s.pk }}" data-name="{{ s.name }}" data-url="{% url 'server_unlock' s.pk %}">Unlock</button>{% endif %}{% endwith %}{% endif %}
