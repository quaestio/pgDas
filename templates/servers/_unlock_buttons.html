{% if user.is_staff and s.asks_for_secret %}{% with until=s.unlocked_until %}{% if until %}<span class="badge ok" title="Unlocked until {{ until|date:'H:i' }} UTC">unlocked</span> <button type="button" class="btn" data-server-lock="{{ s.sid }}" data-url="{% url 'server_lock' s.pk %}">Lock</button>{% else %}<span class="badge warn" title="Its password or SSH key passphrase is not saved">locked</span> <button type="button" class="btn primary" data-server-unlock="{{ s.sid }}" data-name="{{ s.name }}" data-url="{% url 'server_unlock' s.pk %}"{% if s.needs_password_unlock %} data-needs-password="1"{% endif %}{% if s.ssh_enabled and s.ssh_prompt_passphrase %} data-needs-passphrase="1"{% endif %}>Unlock</button>{% endif %}{% endwith %}{% endif %}
